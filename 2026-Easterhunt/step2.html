<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Påskeeggjakt 2026 - Steg 2</title>
  <link rel="stylesheet" href="style.css">
  <script src="scripts/hunt.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="banner">Team 101 - Påskeeggjakt 2026 <a class="banner-link" href="index.html">Start på nytt</a></div>
    <section class="content">
      <p class="step">Steg 2 av 7</p>
      <h1>Allmennkunnskap</h1>
      <div class="challenge">
        <p>Hvilken planet er kjent som den røde planeten?</p>
      </div>
      <form data-challenge-form data-accepted="Mars" data-next="step3.html" data-next-label="Gå til steg 3" data-success-message="Riktig! Mars kalles den røde planeten fordi overflaten inneholder mye jernoksid, altså rustfarget støv.">
        <label for="answer">Skriv svaret:</label>
        <input id="answer" name="answer" type="text" autocomplete="off" required>
        <div class="actions">
          <button type="submit">Sjekk svar</button>
        </div>
      </form>
      <p class="feedback" data-feedback></p>
      <div data-next></div>
    </section>
  </main>
</body>
</html>
