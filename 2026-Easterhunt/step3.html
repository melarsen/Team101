<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Påskeeggjakt 2026 - Steg 3</title>
  <link rel="stylesheet" href="style.css">
  <script src="scripts/egg-game.js" defer></script>
</head>
<body>
  <main class="card">
    <div class="banner">Team 101 - Påskeeggjakt 2026 <a class="banner-link" href="index.html">Start på nytt</a></div>
    <section class="content">
      <p class="step">Steg 3 av 7</p>
      <h1>Minispill: fang påskeegget</h1>
      <div class="challenge">
        <p>Klikk på egget som flytter seg rundt. Nå minst 8 poeng før tiden går ut for å låse opp neste URL.</p>
      </div>
      <div class="game-panel" data-egg-game data-next="step4.html" data-next-label="Gå til steg 4" data-target="8" data-time="20">
        <p class="game-status">Poeng: <strong data-score>0</strong> / <strong data-target>8</strong> | Tid igjen: <strong data-time-left>20</strong>s</p>
        <p class="countdown-text" data-countdown>Nedtelling: 20</p>
        <div class="game-area" data-game-area>
          <button type="button" class="egg-btn" data-egg-button aria-label="Påskeegg">🥚</button>
        </div>
        <div class="actions">
          <button type="button" data-start-game>Start spill</button>
        </div>
      </div>
      <p class="feedback" data-feedback></p>
      <div data-result></div>
    </section>
  </main>
</body>
</html>
