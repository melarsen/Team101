      <h1>Programmering: for-lokke</h1>
      <div class="challenge">
        <p>Hva blir verdien av <strong>sum</strong> etter denne koden?</p>
        <span class="code">let sum = 0;
for (let i = 1; i &lt;= 5; i++) {
  sum += i;
}
console.log(sum);</span>
