<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <title>Team 101</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.3.0/css/all.min.css">
<!-- <script src="script.js" defer></script> -->
  <script data-goatcounter="https://melarsen-github.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>
    <div class="wrapper">
      <nav class="hunt-menu" aria-label="Påskeeggjakt meny">
        <ul>
          <li>
            <a href="#">Påskeeggjakt</a>
            <ul class="submenu">
              <li>
                <button class="year-toggle" aria-label="Vis undermeny for 2024">2024</button>
                <ul class="submenu submenu--nested">
                  <li><a href="2024-Easterhunt/index.html">Påskeeggjakt</a></li>
                  <li><a href="2024-Easterhunt/2024-easterhunt-gameplan.pdf" target="_blank">Gameplan</a></li>
                </ul>
              </li>
              <li>
                <button class="year-toggle" aria-label="Vis undermeny for 2025">2025</button>
                <ul class="submenu submenu--nested">
                  <li><a href="2025-Easterhunt/index.html">Påskeeggjakt</a></li>
                  <li><a href="2025-Easterhunt/2025-easterhunt-gameplan.pdf" target="_blank">Gameplan</a></li>
                </ul>
              </li>
              <li><a href="2026-Easterhunt/index.html">2026</a></li>
            </ul>
          </li>
        </ul>
      </nav>
      <div class="easter-banner">
        <span class="easter">Velkommen til Team101 sin påskeeggjakt!</span>
      </div>
      <!-- <div class="easter-details">
        <span class="easter"></span>
      </div>
      <div class="easter-details">
        <span class="easter"></span>
      </div> -->
      <div class="easter-board">
        <img src="images/happy-easter-four.gif" id="easter" alt="">
      </div>
    </div>
    <script>
    (function () {
      var mq = window.matchMedia('(max-width: 800px)');
      document.addEventListener('click', function (e) {
        if (!mq.matches) return;
        var topLink = e.target.closest('.hunt-menu > ul > li > a');
        if (topLink) {
          e.preventDefault();
          topLink.closest('li').classList.toggle('is-open');
          return;
        }
        var toggleBtn = e.target.closest('.submenu-toggle, .year-toggle');
        if (toggleBtn) {
          e.preventDefault();
          var li = toggleBtn.closest('li');
          li.classList.toggle('is-open');
          return;
        }
        if (!e.target.closest('.hunt-menu')) {
          document.querySelectorAll('.hunt-menu li.is-open').forEach(function (li) {
            li.classList.remove('is-open');
          });
        }
      });
    }());
    </script>
  </body>
</html>
